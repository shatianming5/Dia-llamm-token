# Train policy config (torch/DDP) (oracle imitation, listwise CE + zscore features) (RadGenome-ChestCT: lung nodule, full-eligible) (E0959 smoke seed0)

run_id: E0959_smoke_seed0
out_dir: outputs/train_policy

dataset_jsonl: artifacts/radgenome_policy_dataset_oracle_lung_nodule_full_eligible_e0950_smoke/dataset.jsonl

seed: 0

ddp:
  backend: nccl
  fp16: false

train:
  epochs: 20
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.0
  ridge: 1.0e-6
  loss: list_ce
  label_key: label
  feature_norm: zscore
  feature_norm_eps: 1.0e-6

model:
  # 4 base features + xyz centers + mean/max intensity + level
  input_dim: 10
  hidden_dims: [128, 128]
  activation: relu


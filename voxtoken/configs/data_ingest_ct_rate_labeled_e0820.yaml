# Data ingest config (CT-RATE validation subset + predicted labels) (E0820)

source: ct_rate
ct_rate_root: /data/ct_rate

split: validation
num_cases: 20
seed: 0

out_dir: artifacts/ct_rate_labeled_raw_e0820
manifest_path: artifacts/ct_rate_labeled_raw_e0820/manifest.jsonl

prefer_resolved_volume: true
volume_search_roots:
  - dataset/valid

include_predicted_labels: true

report_fields:
  - Findings_EN
  - Impressions_EN


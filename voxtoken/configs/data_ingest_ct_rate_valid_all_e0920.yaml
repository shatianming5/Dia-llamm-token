# Data ingest config (CT-RATE validation volumes on this machine) (E0920)
#
# Goal: create a manifest over the *available* CT-RATE volumes under dataset/valid,
# so we can deterministically split them into train/val for repo-skeleton loops.

source: ct_rate
ct_rate_root: /data/ct_rate

split: validation
num_cases: 38
seed: 0

out_dir: artifacts/ct_rate_raw_valid_all_e0920
manifest_path: artifacts/ct_rate_raw_valid_all_e0920/manifest.jsonl

prefer_resolved_volume: true
volume_search_roots:
  - dataset/valid

report_fields:
  - Findings_EN
  - Impressions_EN


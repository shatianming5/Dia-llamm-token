name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  data_free_sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data-free smoke + eval
        run: |
          python -m voxtoken.runner.smoke --out artifacts/ci_smoke
          python -m voxtoken.runner.unified_eval --in artifacts/ci_smoke/run.json --out artifacts/ci_eval

      - name: Data-free inference + sidecars
        run: |
          python -m voxtoken.runner.infer_refine --out artifacts/ci_infer --budget 16 --config voxtoken/configs/inference.yaml
          python -m voxtoken.runner.validate_run --in artifacts/ci_infer/run.json --require-final-report-txt --require-evidence-graph-json --require-trace-jsonl

